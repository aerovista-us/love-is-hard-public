name: Learning module checks
on:
  pull_request:
    paths:
      - "scripts/build-site.mjs"
      - "site/lesson-*.html"
      - "site/interactive-learning.*"
      - "site/learning-labs.*"
      - "site/anticipatory-interpretation.html"
      - "site/perception-test.html"
      - "site/understanding-session.html"
      - "site/communication-guide.html"
      - "site/index.html"
      - "site/fairness-explained.html"
      - ".github/workflows/learning-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse scripts
        run: |
          node --check scripts/build-site.mjs
          node --check site/interactive-learning.js
          node --check site/learning-labs.js
      - name: Regenerate site
        run: node scripts/build-site.mjs
      - name: Verify learning modules
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          import assert from 'node:assert/strict';
          for(let i=1;i<=8;i++){
            const name='site/lesson-'+String(i).padStart(2,'0')+'.html';
            const html=readFileSync(name,'utf8');
            assert.match(html,/id="guided-deep-dive"/,name+' guided section');
            assert.match(html,/interactive-learning\.js/,name+' script reference');
            assert.match(html,/interactive-learning\.css/,name+' CSS reference');
          }
          assert.ok(existsSync('site/anticipatory-interpretation.html'));
          const fairness=readFileSync('site/fairness-explained.html','utf8');
          assert.match(fairness,/How We Work to Keep Love Is Hard Fair/);
          assert.match(fairness,/What actually happened/);
          assert.match(fairness,/Where we can still improve/);
          assert.match(readFileSync('site/index.html','utf8'),/fairness-explained[.]html/);
          const guide=readFileSync('site/communication-guide.html','utf8');
          assert.match(guide,/Understand the Conflict/);
          assert.match(guide,/Consent and safety are not negotiable/);
          assert.match(readFileSync('site/index.html','utf8'),/communication-guide[.]html/);
          const session=readFileSync('site/understanding-session.html','utf8');
          assert.match(session,/The 20-Minute Understanding Session/);
          assert.match(session,/function persist/);
          assert.match(readFileSync('site/index.html','utf8'),/understanding-session\.html/);
          const perception=readFileSync('site/perception-test.html','utf8');
          assert.match(perception,/How Perceptive Are You/);
          assert.match(perception,/Additional clue|New information/);
          assert.match(perception,/Confirmation bias occurs/);
          assert.match(readFileSync('site/index.html','utf8'),/anticipatory-interpretation\.html/);
          console.log('Eight guided lessons, interactive assets, and companion route verified.');
          NODE
